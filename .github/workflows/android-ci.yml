name: Android CI

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Assemble APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean, run unit tests and assemble release
        run: |
          set +e
          ./gradlew clean test assembleRelease --stacktrace 2>&1 | tee gradle-output.log
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$code" >> "$GITHUB_ENV"
          exit $code
        continue-on-error: true

      # Surface the build verdict + errors as check annotations so they are
      # readable through the REST API (workflow logs are not always reachable).
      - name: Report gradle result
        if: always()
        run: |
          echo "=== gradle exit: ${GRADLE_EXIT:-unset} ==="
          echo "--- error lines ---"
          grep -E "^e: |error: |Execution failed|What went wrong|Caused by:|Could not |SDK location" gradle-output.log | head -10 || echo "(no error lines)"
          echo "--- log tail ---"
          tail -n 10 gradle-output.log
          echo "--- build outputs ---"
          find app/build/outputs -type f 2>/dev/null | head -10 || echo "(no outputs)"
          # Annotations for external readers:
          grep -E "^e: |error: |Execution failed|What went wrong|Caused by:" gradle-output.log | head -8 | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done
          tail -n 3 gradle-output.log | while IFS= read -r line; do
            echo "::notice::${line:0:300}"
          done
          find app/build/outputs -name "*.apk" 2>/dev/null | head -5 | while IFS= read -r f; do
            echo "::notice::APK: $f"
          done
          if [ "${GRADLE_EXIT:-1}" != "0" ]; then
            echo "::error::Gradle failed with exit ${GRADLE_EXIT:-unset}"
            exit 1
          fi

      - name: Upload APK artifact
        if: env.GRADLE_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload gradle output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-output
          path: android/gradle-output.log
          if-no-files-found: warn
