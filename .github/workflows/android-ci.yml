name: Android CI

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Assemble APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean, run unit tests and assemble release
        run: |
          set +e
          # Debug-variant unit tests (Robolectric Compose tests need the debug
          # ui-test-manifest activity; release classes are identical here since
          # minification is disabled). Release APK is still assembled + verified.
          ./gradlew clean testDebugUnitTest assembleRelease --stacktrace 2>&1 | tee gradle-output.log
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$code" >> "$GITHUB_ENV"
          exit $code
        continue-on-error: true

      # Surface failing unit tests + build errors as check annotations.
      # GitHub caps error annotations at 10 per job: tests get priority.
      - name: Report gradle result
        if: always()
        run: |
          echo "=== gradle exit: ${GRADLE_EXIT:-unset} ==="
          if ls app/build/test-results/test*UnitTest/*.xml >/dev/null 2>&1; then
            python3 -c "import glob, xml.etree.ElementTree as ET; res = [print('::error::TEST FAILED ' + tc.get('classname') + '.' + tc.get('name') + ' :: ' + ((fail.get('message') or '').replace(chr(10), ' '))[:350]) for f in sorted(glob.glob('app/build/test-results/test*UnitTest/*.xml')) for tc in ET.parse(f).getroot().iter('testcase') for fail in list(tc.iter('failure')) + list(tc.iter('error'))][:8]"
            grep -h "at ir.talayar" app/build/test-results/test*UnitTest/*.xml 2>/dev/null | sed 's/^ *//' | sort -u | head -6 | while IFS= read -r frame; do
              echo "::notice::FRAME $frame"
            done
          else
            echo "(no unit test results)"
          fi
          echo "--- error lines ---"
          grep -E "^e: |error: |Execution failed|What went wrong|Caused by:|Could not |SDK location" gradle-output.log | head -10 || echo "(no error lines)"
          echo "--- log tail ---"
          tail -n 12 gradle-output.log
          # Error annotations (within GitHub's 10-per-job cap):
          grep -E "^e: |error: |Execution failed|What went wrong|Caused by:" gradle-output.log | sort -u | head -6 | while IFS= read -r line; do
            echo "::error::${line:0:450}"
          done
          tail -n 5 gradle-output.log | while IFS= read -r line; do
            echo "::notice::TAIL: ${line:0:250}"
          done
          if [ "${GRADLE_EXIT:-1}" != "0" ]; then
            echo "::error::Gradle failed with exit ${GRADLE_EXIT:-unset}"
            exit 1
          fi

      # Integrity gate: the APK that CI just built must carry the version declared
      # in app/build.gradle.kts and must really ship the app's UI copy.
      - name: Verify the release APK (version + shipped copy)
        if: env.GRADLE_EXIT == '0'
        run: |
          bash "${{ github.workspace }}/.github/scripts/verify-apk.sh" \
            --apk app/build/outputs/apk/release/app-release.apk \
            --gradle app/build.gradle.kts \
            --string "سلام جواد عیسی لو"

      - name: Upload APK artifact
        if: env.GRADLE_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload gradle output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-output
          path: android/gradle-output.log
          if-no-files-found: warn

  # Diagnostic job (manual dispatch only, kept off `main`): compares the signing
  # certificate of the newest published release APK with the previous one. Two
  # APKs signed with different certificates cannot be upgraded in place — Android
  # refuses with INSTALL_FAILED_UPDATE_INCOMPATIBLE — which is exactly what the
  # in-app updater hands to the system installer.
  apk-signature-compatibility:
    name: APK Signature Compatibility (dispatch only)
    # workflow_dispatch is not available to this automation token, so the job is
    # scoped to the diagnostic branch instead and runs on a normal push there.
    if: github.ref == 'refs/heads/arena/01a094fb-currency-app'
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the two newest published release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAGS="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" \
            --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name] | .[]')"
          echo "published releases (newest first): $TAGS"
          NEW_TAG="$(printf '%s\n' "$TAGS" | sed -n 1p)"
          OLD_TAG="$(printf '%s\n' "$TAGS" | sed -n 2p)"
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"
          echo "OLD_TAG=$OLD_TAG" >> "$GITHUB_ENV"
          mkdir -p apkcmp/new apkcmp/old
          gh release download "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --pattern "app-release-*.apk" --dir apkcmp/new --clobber
          gh release download "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --pattern "app-release-*.apk" --dir apkcmp/old --clobber
          find apkcmp -name '*.apk' -printf '%p  %s bytes\n'

      - name: Compare the signing certificates
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          echo "apksigner: ${APKSIGNER:-<not found>}"

          cert_sha256() {
            local apk="$1" out=""
            if [ -n "$APKSIGNER" ]; then
              out="$("$APKSIGNER" verify --print-certs "$apk" 2>/dev/null \
                    | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
            fi
            if [ -z "$out" ]; then
              out="$(keytool -printcert -jarfile "$apk" 2>/dev/null \
                    | sed -n 's/^SHA256: //p' | head -1 | tr -d ':')"
            fi
            printf '%s' "$out"
          }

          NEW_APK="$(find apkcmp/new -name '*.apk' | head -1)"
          OLD_APK="$(find apkcmp/old -name '*.apk' | head -1)"
          NEW_CERT="$(cert_sha256 "$NEW_APK")"
          OLD_CERT="$(cert_sha256 "$OLD_APK")"

          echo "$NEW_TAG signer certificate SHA-256 : ${NEW_CERT:-<unreadable>}"
          echo "$OLD_TAG signer certificate SHA-256 : ${OLD_CERT:-<unreadable>}"
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs -v "$NEW_APK" 2>/dev/null | head -12 || true; fi

          if [ -z "$NEW_CERT" ] || [ -z "$OLD_CERT" ]; then
            echo "::warning::could not read one of the signing certificates ($NEW_TAG='${NEW_CERT:-?}' / $OLD_TAG='${OLD_CERT:-?}')"
            exit 0
          fi
          if [ "$NEW_CERT" = "$OLD_CERT" ]; then
            echo "::notice title=APK signature compatibility::SAME signing certificate for $OLD_TAG and $NEW_TAG (SHA-256 $NEW_CERT) — the in-app update installs over the previous version."
          else
            echo "::warning title=APK signature compatibility::DIFFERENT signing certificates: $OLD_TAG=$OLD_CERT vs $NEW_TAG=$NEW_CERT — Android refuses an in-place upgrade (INSTALL_FAILED_UPDATE_INCOMPATIBLE); the previous version must be uninstalled once. Cause: no ANDROID_KEYSTORE_* secrets, so every CI run generates a fresh debug key."
          fi
