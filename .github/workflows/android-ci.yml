name: Android CI

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Assemble APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean, run unit tests and assemble release
        run: |
          set -o pipefail
          ./gradlew clean test assembleRelease --stacktrace 2>&1 | tee gradle-output.log
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"
        continue-on-error: true

      # Surface compile/test errors as check annotations so they are readable
      # through the REST API (workflow logs can be hard to reach externally).
      - name: Report gradle errors
        if: env.GRADLE_EXIT != '0'
        run: |
          echo "Gradle failed with exit $GRADLE_EXIT"
          grep -E "^e: |error:|FAILED|Execution failed" gradle-output.log | head -60 || true
          grep -E "^e: |error: " gradle-output.log | sort -u | head -50 | while IFS= read -r line; do
            echo "::error::${line:0:600}"
          done
          exit 1

      - name: Upload APK artifact
        if: env.GRADLE_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload gradle output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-output
          path: android/gradle-output.log
          if-no-files-found: warn
