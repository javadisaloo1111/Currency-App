name: Android CI

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Assemble APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean, run unit tests and assemble release
        run: |
          set +e
          ./gradlew clean test assembleRelease --stacktrace 2>&1 | tee gradle-output.log
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$code" >> "$GITHUB_ENV"
          exit $code
        continue-on-error: true

      # Surface failing unit tests + build errors as check annotations.
      # GitHub caps error annotations at 10 per job: tests get priority.
      - name: Report gradle result
        if: always()
        run: |
          echo "=== gradle exit: ${GRADLE_EXIT:-unset} ==="
          if ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
            python3 - <<'EOF'
            import glob, xml.etree.ElementTree as ET
            n = 0
            for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
                root = ET.parse(f).getroot()
                for tc in root.iter('testcase'):
                    for fail in list(tc.iter('failure')) + list(tc.iter('error')):
                        if n >= 8: break
                        n += 1
                        name = f"{tc.get('classname')}.{tc.get('name')}"
                        msg = (fail.get('message') or '').replace('\n',' ')[:350]
                        print(f"::error::TEST FAILED {name} :: {msg}")
            if n: print(f"::notice::{n} failing tests (first 8 shown)")
            EOF
          else
            echo "(no unit test results)"
          fi
          echo "--- error lines ---"
          grep -E "^e: |error: |Execution failed|What went wrong|Caused by:|Could not |SDK location" gradle-output.log | head -10 || echo "(no error lines)"
          echo "--- log tail ---"
          tail -n 10 gradle-output.log
          if [ "${GRADLE_EXIT:-1}" != "0" ]; then
            echo "::error::Gradle failed with exit ${GRADLE_EXIT:-unset}"
            exit 1
          fi

      - name: Upload APK artifact
        if: env.GRADLE_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload gradle output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-output
          path: android/gradle-output.log
          if-no-files-found: warn
