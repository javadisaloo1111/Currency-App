name: Android Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or new tag to release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, Build, Sign & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Create tag if missing (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "talayar-release-bot"
            git config user.email "actions@github.com"
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/talayar-release.p12"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the repository release keystore."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set; the APK will be signed with the debug key. See docs/RELEASE.md to configure production signing."
          fi

      - name: Clean, run unit tests and assemble signed release APK
        working-directory: android
        env:
          TALAYAR_KEYSTORE_PATH: ${{ steps.keystore.outputs.present == 'true' && format('{0}/talayar-release.p12', runner.temp) || '' }}
          TALAYAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TALAYAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TALAYAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew clean testDebugUnitTest assembleRelease --stacktrace

      - name: Name the APK after the tag and publish its checksum
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          NAMED="android/app/build/outputs/apk/release/app-release-${TAG}.apk"
          cp "$APK" "$NAMED"
          cd android/app/build/outputs/apk/release
          sha256sum "app-release-${TAG}.apk" > "app-release-${TAG}.apk.sha256"
          echo "APK_SIZE=$(stat -c%s "app-release-${TAG}.apk")" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$(cut -d' ' -f1 "app-release-${TAG}.apk.sha256")" >> "$GITHUB_STEP_SUMMARY"

      # Publish gate: the APK attached to this release must really be the tagged
      # version (versionName/versionCode read back from the built package) and
      # must ship the app's UI copy. The report ends up in the release notes.
      - name: Verify the release APK (tag == versionName/versionCode + shipped copy)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          bash .github/scripts/verify-apk.sh \
            --apk "android/app/build/outputs/apk/release/app-release-${TAG}.apk" \
            --gradle android/app/build.gradle.kts \
            --tag "$TAG" \
            --string "سلام جواد عیسی لو" \
            --report "$RUNNER_TEMP/APK_VERIFICATION.md"

      - name: Write release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/RELEASE_NOTES.md" <<EOF
          # طلایار (Talayar) — بازار طلا، سکه و ارز

          قیمت لحظه‌ای طلا، سکه و ارزهای مهم بازار ایران با رابط کاربری فارسی، حالت تیره، نمودار قیمت، علاقه‌مندی‌ها و هشدار قیمت.

          **این نسخه ($TAG) شامل:**
          - نمایش قیمت طلای ۱۸ و ۲۴ عیار، مثقال، انس جهانی، سکه‌های امامی/بهار آزادی/نیم/ربع/گرمی، دلار، یورو، پوند، درهم، تتر و…
          - به‌روزرسانی خودکار و دستی (Pull-to-Refresh) با نمایش «آخرین بروزرسانی»
          - نمودار تعاملی قیمت با بازه‌های 1H تا 1Y
          - کارکرد آفلاین (Offline-First) با ذخیره‌سازی محلی آخرین قیمت‌ها
          - علاقه‌مندی‌ها، جستجو، هشدار قیمت با نوتیفیکیشن
          - طراحی Material 3، کاملاً فارسی و راست‌به‌چپ با فونت وزیرمتن

          ## نصب
          فایل \`app-release-${TAG}.apk\` را دانلود و نصب کنید (اجازه نصب از منابع ناشناس لازم است).
          از نسخه ۱.۰.۱ به بعد، خود برنامه هم به‌صورت خودکار نسخهٔ جدید را پیدا می‌کند، با تأیید شما دانلود می‌کند و نصب می‌کند (تنظیمات ← بررسی بروزرسانی).
          تمام قیمت‌ها — از جمله انس جهانی طلا — به تومان نمایش داده می‌شوند.
          منبع قیمت‌ها: Price Gateway چندمنبعی با Failover خودکار — برای به‌روزرسانی لحظه‌ای می‌توانید سرور اختصاصی متصل شوید (README بخش Deployment).

          ## لینک مستقیم دانلود
          https://github.com/javadisaloo1111/Currency-App/releases/download/${TAG}/app-release-${TAG}.apk

          ## تأیید خودکار بستهٔ انتشار (CI)
          EOF
          cat "$RUNNER_TEMP/APK_VERIFICATION.md" >> "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "android/app/build/outputs/apk/release/app-release-${TAG}.apk" \
            "android/app/build/outputs/apk/release/app-release-${TAG}.apk.sha256" \
            --title "Gold Market Android $TAG" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" \
            --latest

      # Final gate: pull the asset back through its public release URL and prove
      # the published bytes are identical to the verified build (SHA-256). The
      # confirmation is appended to the release notes.
      - name: Verify the published asset (download it back from the release URL)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -uo pipefail
          URL="https://github.com/javadisaloo1111/Currency-App/releases/download/${TAG}/app-release-${TAG}.apk"
          LOCAL="android/app/build/outputs/apk/release/app-release-${TAG}.apk"
          EXPECTED="$(sha256sum "$LOCAL" | cut -d' ' -f1)"
          TMP="$(mktemp -d)"
          downloaded=false
          for attempt in 1 2 3; do
            if curl -fsSL --retry 2 -o "$TMP/published.apk" "$URL"; then downloaded=true; break; fi
            echo "download attempt $attempt failed, retrying in 10s..." >&2
            sleep 10
          done
          if [ "$downloaded" != "true" ]; then
            echo "::warning::could not fetch $URL from the runner (asset upload itself succeeded — see the release page)"
          else
            ACTUAL="$(sha256sum "$TMP/published.apk" | cut -d' ' -f1)"
            PUB_SIZE="$(stat -c%s "$TMP/published.apk")"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::published asset SHA-256 mismatch (expected $EXPECTED, downloaded $ACTUAL)"
              exit 1
            fi
            echo "published asset verified: $URL ($PUB_SIZE bytes, SHA-256 $ACTUAL)"
            {
              echo ""
              echo "✅ فایل بالا از لینک مستقیم Release دوباره دانلود و بررسی شد: SHA-256 دانلود با بستهٔ Build برابر است (${PUB_SIZE} bytes)."
            } >> "$RUNNER_TEMP/RELEASE_NOTES.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi
          rm -rf "$TMP"
