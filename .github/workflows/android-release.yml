name: Android Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or new tag to release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, Build, Sign & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # A tag push checks out the tag itself. A workflow_dispatch may name a tag
      # that does not exist yet, so it checks out the dispatched ref (branch) and
      # the next step creates + pushes the tag there. Checking out a missing tag
      # would abort the job before it could be created.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Create tag if missing (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "talayar-release-bot"
            git config user.email "actions@github.com"
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/talayar-release.p12"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the repository release keystore."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set; the APK will be signed with the debug key. See docs/RELEASE.md to configure production signing."
          fi

      - name: Clean, run unit tests and assemble signed release APK
        working-directory: android
        env:
          TALAYAR_KEYSTORE_PATH: ${{ steps.keystore.outputs.present == 'true' && format('{0}/talayar-release.p12', runner.temp) || '' }}
          TALAYAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TALAYAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TALAYAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew clean testDebugUnitTest assembleRelease --stacktrace

      - name: Name the APK after the tag and publish its checksum
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          NAMED="android/app/build/outputs/apk/release/app-release-${TAG}.apk"
          cp "$APK" "$NAMED"
          cd android/app/build/outputs/apk/release
          sha256sum "app-release-${TAG}.apk" > "app-release-${TAG}.apk.sha256"
          echo "APK_SIZE=$(stat -c%s "app-release-${TAG}.apk")" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SHA256=$(cut -d' ' -f1 "app-release-${TAG}.apk.sha256")" >> "$GITHUB_STEP_SUMMARY"

      # Publish gate: the APK attached to this release must really be the tagged
      # version (versionName/versionCode read back from the built package) and
      # must ship the app's UI copy. The report ends up in the release notes.
      - name: Verify the release APK (tag == versionName/versionCode + shipped copy)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          bash .github/scripts/verify-apk.sh \
            --apk "android/app/build/outputs/apk/release/app-release-${TAG}.apk" \
            --gradle android/app/build.gradle.kts \
            --tag "$TAG" \
            --string "سلام جواد عیسی لو" \
            --report "$RUNNER_TEMP/APK_VERIFICATION.md"

      - name: Write release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/RELEASE_NOTES.md" <<EOF
          # طلایار (Talayar) — بازار طلا، سکه و ارز

          قیمت لحظه‌ای طلا، سکه و ارزهای مهم بازار ایران با رابط کاربری فارسی، حالت تیره، نمودار قیمت، علاقه‌مندی‌ها و هشدار قیمت.

          **این نسخه ($TAG) شامل:**
          - نمایش قیمت طلای ۱۸ و ۲۴ عیار، مثقال، انس جهانی، سکه‌های امامی/بهار آزادی/نیم/ربع/گرمی، دلار، یورو، پوند، درهم، تتر و…
          - به‌روزرسانی خودکار و دستی (Pull-to-Refresh) با نمایش «آخرین بروزرسانی»
          - نمودار تعاملی قیمت با بازه‌های 1H تا 1Y
          - کارکرد آفلاین (Offline-First) با ذخیره‌سازی محلی آخرین قیمت‌ها
          - علاقه‌مندی‌ها، جستجو، هشدار قیمت با نوتیفیکیشن
          - طراحی Material 3، کاملاً فارسی و راست‌به‌چپ با فونت وزیرمتن

          ## نصب
          فایل \`app-release-${TAG}.apk\` را دانلود و نصب کنید (اجازه نصب از منابع ناشناس لازم است).
          از نسخه ۱.۰.۱ به بعد، خود برنامه هم به‌صورت خودکار نسخهٔ جدید را پیدا می‌کند، با تأیید شما دانلود می‌کند و نصب می‌کند (تنظیمات ← بررسی بروزرسانی).
          تمام قیمت‌ها — از جمله انس جهانی طلا — به تومان نمایش داده می‌شوند.
          منبع قیمت‌ها: Price Gateway چندمنبعی با Failover خودکار — برای به‌روزرسانی لحظه‌ای می‌توانید سرور اختصاصی متصل شوید (README بخش Deployment).

          ## لینک مستقیم دانلود
          https://github.com/javadisaloo1111/Currency-App/releases/download/${TAG}/app-release-${TAG}.apk

          ## تأیید خودکار بستهٔ انتشار (CI)
          EOF
          cat "$RUNNER_TEMP/APK_VERIFICATION.md" >> "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "android/app/build/outputs/apk/release/app-release-${TAG}.apk" \
            "android/app/build/outputs/apk/release/app-release-${TAG}.apk.sha256" \
            --title "Gold Market Android $TAG" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" \
            --latest

      # Final gate: pull the asset back through its public release URL and prove
      # the published bytes are identical to the verified build (SHA-256). The
      # confirmation is appended to the release notes.
      - name: Verify the published asset (download it back from the release URL)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -uo pipefail
          URL="https://github.com/javadisaloo1111/Currency-App/releases/download/${TAG}/app-release-${TAG}.apk"
          LOCAL="android/app/build/outputs/apk/release/app-release-${TAG}.apk"
          EXPECTED="$(sha256sum "$LOCAL" | cut -d' ' -f1)"
          TMP="$(mktemp -d)"
          downloaded=false
          for attempt in 1 2 3; do
            if curl -fsSL --retry 2 -o "$TMP/published.apk" "$URL"; then downloaded=true; break; fi
            echo "download attempt $attempt failed, retrying in 10s..." >&2
            sleep 10
          done
          if [ "$downloaded" != "true" ]; then
            echo "::warning::could not fetch $URL from the runner (asset upload itself succeeded — see the release page)"
          else
            ACTUAL="$(sha256sum "$TMP/published.apk" | cut -d' ' -f1)"
            PUB_SIZE="$(stat -c%s "$TMP/published.apk")"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::published asset SHA-256 mismatch (expected $EXPECTED, downloaded $ACTUAL)"
              exit 1
            fi
            echo "published asset verified: $URL ($PUB_SIZE bytes, SHA-256 $ACTUAL)"
            {
              echo ""
              echo "✅ فایل بالا از لینک مستقیم Release دوباره دانلود و بررسی شد: SHA-256 دانلود با بستهٔ Build برابر است (${PUB_SIZE} bytes)."
            } >> "$RUNNER_TEMP/RELEASE_NOTES.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi
          rm -rf "$TMP"

      # Answers the question that decides whether users can upgrade in place: is this
      # APK signed with the SAME certificate as the previous published release? With
      # no ANDROID_KEYSTORE_* secrets every CI run invents a fresh debug key, and
      # Android then refuses INSTALL_FAILED_UPDATE_INCOMPATIBLE. Reported in the log,
      # as an annotation and inside the release notes (never fails the release).
      - name: Compare the signing certificate with the previous release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -uo pipefail
          NEW_APK="android/app/build/outputs/apk/release/app-release-${TAG}.apk"
          PREV_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=10" \
            --jq "[.[] | select(.draft == false and .prerelease == false and .tag_name != \"${TAG}\") | .tag_name] | .[0] // empty" 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            echo "::notice::no previous published release — nothing to compare the signing certificate with"
            exit 0
          fi
          echo "comparing ${TAG} against ${PREV_TAG}"
          mkdir -p "$RUNNER_TEMP/prev"
          if ! gh release download "$PREV_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "app-release-*.apk" --dir "$RUNNER_TEMP/prev" --clobber; then
            echo "::warning::could not download the ${PREV_TAG} package for a certificate comparison"
            exit 0
          fi
          PREV_APK="$(find "$RUNNER_TEMP/prev" -name '*.apk' | head -1)"

          # minSdk 26 -> APK Signature Scheme v2 only, so keytool cannot read the
          # certificate; apksigner must. Try every installed build-tools, newest first.
          cert_sha256() {
            local apk="$1" out="" tool
            local sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            for tool in $(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -Vr); do
              out="$("$tool" verify --print-certs "$apk" 2>/dev/null \
                    | sed -n 's/^[[:space:]]*Signer #1 certificate SHA-256 digest:[[:space:]]*//p' | head -1)"
              if [ -n "$out" ]; then printf '%s' "$out"; return 0; fi
            done
            out="$(keytool -printcert -jarfile "$apk" 2>/dev/null | sed -n 's/^SHA256: //p' | head -1 | tr -d ':')"
            if [ -n "$out" ]; then printf '%s' "$out"; return 0; fi
            return 1
          }

          NEW_CERT="$(cert_sha256 "$NEW_APK" || true)"
          PREV_CERT="$(cert_sha256 "$PREV_APK" || true)"
          echo "${TAG}    signer certificate SHA-256: ${NEW_CERT:-<unreadable>}"
          echo "${PREV_TAG}    signer certificate SHA-256: ${PREV_CERT:-<unreadable>}"
          if [ -z "$NEW_CERT" ] || [ -z "$PREV_CERT" ]; then
            echo "::warning::could not read a signing certificate (${TAG}='${NEW_CERT:-?}' / ${PREV_TAG}='${PREV_CERT:-?}')"
            exit 0
          fi
          if [ "$NEW_CERT" = "$PREV_CERT" ]; then
            echo "::notice title=Signing certificate::${TAG} is signed with the SAME certificate as ${PREV_TAG} (${NEW_CERT}) — an in-place in-app update works."
            {
              echo ""
              echo "✅ **امضا:** گواهی یکسان — ${TAG} با همان گواهی ${PREV_TAG} امضا شده (\`${NEW_CERT}\`)، پس ارتقا از نسخهٔ قبلی بدون حذف نصب انجام می‌شود."
            } >> "$RUNNER_TEMP/RELEASE_NOTES.md"
          else
            echo "::warning title=Signing certificate::DIFFERENT certificates: ${PREV_TAG}=${PREV_CERT} vs ${TAG}=${NEW_CERT} — Android refuses an in-place upgrade (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Cause: no ANDROID_KEYSTORE_* secrets, so CI generated a fresh debug key. See docs/RELEASE.md."
            {
              echo ""
              echo "⚠️ **امضا:** گواهی امضای ${TAG} (\`${NEW_CERT}\`) با گواهی ${PREV_TAG} (\`${PREV_CERT}\`) **متفاوت** است."
              echo "اندروید ارتقای در‌جا را رد می‌کند (\`INSTALL_FAILED_UPDATE_INCOMPATIBLE\`): برای نصب این نسخه باید نسخهٔ قبلی **یک‌بار حذف** شود."
              echo "علت: secretهای \`ANDROID_KEYSTORE_*\` تنظیم نشده‌اند و CI هر بار کلید debug تازه می‌سازد (نگاه کنید به \`docs/RELEASE.md\`)."
            } >> "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"

      # The app's update checker reads release metadata from api.github.com first and
      # from these static mirrors when that host is filtered or rate limited (403) —
      # the same multi-host failover the price snapshot already uses. The payload has
      # exactly the shape of the GitHub release object, so one DTO parses both.
      - name: Publish the static update mirror (update.json on gh-pages)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -uo pipefail
          APK="android/app/build/outputs/apk/release/app-release-${TAG}.apk"
          SHA_FILE="${APK}.sha256"
          export MIRROR_TAG="$TAG"
          export MIRROR_NAME="Gold Market Android ${TAG}"
          export MIRROR_APK_NAME="app-release-${TAG}.apk"
          export MIRROR_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release-${TAG}.apk"
          export MIRROR_APK_SIZE="$(stat -c%s "$APK")"
          export MIRROR_SHA_NAME="app-release-${TAG}.apk.sha256"
          export MIRROR_SHA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release-${TAG}.apk.sha256"
          export MIRROR_SHA_SIZE="$(stat -c%s "$SHA_FILE")"
          export MIRROR_SHA256="$(cut -d' ' -f1 "$SHA_FILE")"
          export MIRROR_APK_DIGEST="sha256:${MIRROR_SHA256}"
          export MIRROR_MIN_VERSION="$(grep -oiE 'minimum_supported_version[[:space:]]*[:=][[:space:]]*v?[0-9]+\.[0-9]+\.[0-9]+' "$RUNNER_TEMP/RELEASE_NOTES.md" | head -1 || true)"
          export MIRROR_VERSION_NAME="${TAG#v}"
          export MIRROR_VERSION_CODE="$(grep -oE 'val appVersionCode = [0-9]+' android/app/build.gradle.kts | grep -oE '[0-9]+' || true)"
          export MIRROR_BODY="$MIRROR_MIN_VERSION"

          python3 - <<'PY' > "$RUNNER_TEMP/update.json"
          import datetime
          import json
          import os

          def asset(name, url, size, content_type, digest=None):
              payload = {
                  "name": name,
                  "browser_download_url": url,
                  "size": int(size),
                  "content_type": content_type,
              }
              if digest:
                  payload["digest"] = digest
              return payload

          payload = {
              # Same field names as GET /repos/{owner}/{repo}/releases/latest.
              "tag_name": os.environ["MIRROR_TAG"],
              "name": os.environ["MIRROR_NAME"],
              "body": os.environ.get("MIRROR_BODY") or "",
              "draft": False,
              "prerelease": False,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "assets": [
                  asset(
                      os.environ["MIRROR_APK_NAME"],
                      os.environ["MIRROR_APK_URL"],
                      os.environ["MIRROR_APK_SIZE"],
                      "application/vnd.android.package-archive",
                      # GitHub publishes this for release assets; the app uses it as the
                      # expected checksum when the .sha256 sidecar is unavailable.
                      os.environ["MIRROR_APK_DIGEST"],
                  ),
                  asset(
                      os.environ["MIRROR_SHA_NAME"],
                      os.environ["MIRROR_SHA_URL"],
                      os.environ["MIRROR_SHA_SIZE"],
                      "application/octet-stream",
                  ),
              ],
              # Not part of the GitHub schema; ignored by the app's parser and useful
              # for humans debugging which source answered.
              "mirror": {
                  "generated_by": "android-release workflow",
                  "sha256": os.environ["MIRROR_SHA256"],
                  "version_name": os.environ["MIRROR_VERSION_NAME"],
                  # Informational only (the app's parser ignores it); 0 when the
                  # gradle value could not be read, so the payload is never broken.
                  "version_code": int(os.environ.get("MIRROR_VERSION_CODE") or 0),
              },
          }
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

          echo "--- update.json ---"
          cat "$RUNNER_TEMP/update.json"

          # Validate BEFORE publishing: an empty, unparseable or wrong-tag
          # update.json would overwrite a good mirror and the app would read it as
          # an authoritative answer. If anything is off, skip the upload.
          VERDICT="$(MIRROR_EXPECTED_TAG="$TAG" python3 - "$RUNNER_TEMP/update.json" <<'PY'
          import json, os, sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  d = json.load(handle)
          except Exception as exc:
              print("BAD:unparseable " + type(exc).__name__); raise SystemExit(0)
          expected = os.environ["MIRROR_EXPECTED_TAG"]
          apk = [a for a in d.get("assets", []) if str(a.get("name", "")).endswith(".apk")]
          if d.get("tag_name") != expected:
              print("BAD:tag_name=" + str(d.get("tag_name"))); raise SystemExit(0)
          if d.get("draft") is not False or d.get("prerelease") is not False:
              print("BAD:draft/prerelease must be false"); raise SystemExit(0)
          if len(apk) != 1 or not str(apk[0].get("browser_download_url", "")).endswith(
              "/releases/download/" + expected + "/app-release-" + expected + ".apk"
          ):
              print("BAD:apk asset/url"); raise SystemExit(0)
          if int(apk[0].get("size", 0)) <= 500000:
              print("BAD:apk size " + str(apk[0].get("size"))); raise SystemExit(0)
          print("OK")
          PY
          )"
          if [ "$VERDICT" != "OK" ]; then
            echo "::warning::generated update.json failed validation ($VERDICT) — the mirror was NOT overwritten"
            exit 0
          fi
          echo "update.json validated for ${TAG}."

          CONTENT_B64="$(base64 -w0 "$RUNNER_TEMP/update.json")"
          EXISTING_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/update.json?ref=gh-pages" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            ARGS=(-f sha="$EXISTING_SHA")
          else
            ARGS=()
          fi
          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/update.json" \
            -f message="release: publish update metadata for ${TAG}" \
            -f content="$CONTENT_B64" \
            -f branch="gh-pages" \
            "${ARGS[@]}" > /dev/null; then
            echo "published https://github.com/${GITHUB_REPOSITORY}/blob/gh-pages/update.json"
            {
              echo ""
              echo "✅ آینهٔ ثابت اطلاعات انتشار به‌روزرسانی شد: \`update.json\` روی شاخهٔ gh-pages (برای شبکه‌هایی که \`api.github.com\` در آن‌ها مسدود یا محدود است)."
            } >> "$RUNNER_TEMP/RELEASE_NOTES.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
          else
            echo "::warning::could not publish update.json to gh-pages — the GitHub API source still works, but the offline mirror is stale"
          fi

      # Proof, not trust: fetch the mirrors back and assert every field the app relies
      # on. GitHub Pages / raw / jsDelivr are CDN-cached, so this retries for a while
      # and warns (never fails the release, which is already published) if the caches
      # have not caught up yet.
      - name: Verify the published update.json mirrors
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -uo pipefail
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release-${TAG}.apk"
          # The published sidecar is authoritative: the "Verify the published asset"
          # step above already proved the released APK hashes to exactly this value.
          EXPECTED_SHA="$(cut -d' ' -f1 "android/app/build/outputs/apk/release/app-release-${TAG}.apk.sha256")"
          OWNER="${GITHUB_REPOSITORY%%/*}"; NAME="${GITHUB_REPOSITORY##*/}"
          MIRRORS="pages|https://${OWNER}.github.io/${NAME}/update.json raw|https://raw.githubusercontent.com/${OWNER}/${NAME}/gh-pages/update.json jsdelivr|https://cdn.jsdelivr.net/gh/${OWNER}/${NAME}@gh-pages/update.json"

          check_mirror() {
            local label="$1" url="$2" body verdict
            body="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$url" 2>/dev/null || true)"
            if [ -z "$body" ]; then echo "${label}: unreachable (CDN may still be warming up)"; return 1; fi
            verdict="$(printf '%s' "$body" | \
              MIRROR_TAG="$TAG" MIRROR_SHA="$EXPECTED_SHA" MIRROR_APK_URL="$APK_URL" \
              python3 -c '
          import json, os, sys

          try:
              d = json.load(sys.stdin)
          except Exception:
              print("unparseable JSON"); raise SystemExit(0)
          apk = [a for a in d.get("assets", []) if str(a.get("name", "")).endswith(".apk")]
          rows = [
              ("tag_name=" + str(d.get("tag_name")), d.get("tag_name") == os.environ["MIRROR_TAG"]),
              ("draft=false", d.get("draft") is False),
              ("prerelease=false", d.get("prerelease") is False),
              ("exactly one apk asset", len(apk) == 1),
              ("apk url", bool(apk) and apk[0].get("browser_download_url") == os.environ["MIRROR_APK_URL"]),
              ("apk size > 500KB", bool(apk) and int(apk[0].get("size", 0)) > 500000),
              ("sha256 digest matches the published apk", bool(apk) and str(apk[0].get("digest", "")).endswith(os.environ["MIRROR_SHA"])),
          ]
          bad = [n for n, ok in rows if not ok]
          print("OK — " + ", ".join(n for n, _ in rows) if not bad else "MISMATCH: " + ", ".join(bad))
          ' 2>/dev/null || echo "unparseable JSON")"
            echo "${label}: ${verdict}"
            case "$verdict" in OK*) return 0 ;; *) return 1 ;; esac
          }

          verified=0
          deadline=$((SECONDS + 180))
          while :; do
            echo "--- mirror check (T+$((SECONDS))s) ---"
            for entry in $MIRRORS; do
              if check_mirror "${entry%%|*}" "${entry##*|}"; then verified=$((verified + 1)); fi
            done
            [ "$verified" -gt 0 ] && break
            [ "$SECONDS" -ge "$deadline" ] && break
            sleep 20
          done

          if [ "$verified" -gt 0 ]; then
            echo "update.json verified on ${verified} mirror(s)."
            {
              echo ""
              echo "✅ آینهٔ \`update.json\` راستی‌آزمایی شد (${verified} میزبان): \`tag_name=${TAG}\`, \`draft=false\`, \`prerelease=false\`, URL و SHA-256 بسته مطابق."
            } >> "$RUNNER_TEMP/RELEASE_NOTES.md"
          else
            echo "::warning::update.json could not be verified on any mirror yet (CDN cache). Re-check manually: https://${OWNER}.github.io/${NAME}/update.json"
            {
              echo ""
              echo "⚠️ آینهٔ \`update.json\` در بازهٔ ۳ دقیقه از هیچ میزبانی قابل راستی‌آزمایی نبود (کش CDN). کمی بعد دستی بررسی کنید."
            } >> "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
